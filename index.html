<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoài Nam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:62.5%;scroll-behavior:smooth}
  body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:#fff;
    user-select:none;
  }
  ::selection{background:#fff;color:#010101}

  /* ===== PROFILE BODY 4 ===== */
  .profile-body-4{
    overflow:hidden;overflow-y:auto;height:100vh;width:100vw;display:flex;
  }
  .profile-body-4::-webkit-scrollbar{width:4px}
  .profile-body-4::-webkit-scrollbar-track{background:#0a0a0a}
  .profile-body-4::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:15px}

  /* ===== STARFIELD ===== */
  .stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .stars-1,.stars-2,.stars-3{position:absolute;animation:starFall linear infinite}
  .stars-1{width:1px;height:1px;animation-duration:50s;box-shadow:var(--s1)}
  .stars-2{width:2px;height:2px;animation-duration:100s;box-shadow:var(--s2)}
  .stars-3{width:3px;height:3px;animation-duration:150s;box-shadow:var(--s3)}
  @keyframes starFall{from{transform:translateY(0)}to{transform:translateY(-2000px)}}

  /* ===== OVERLAY AUDIO ===== */
  .overlay-audio{
    position:fixed;inset:0;z-index:9999;
    background:#000;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .overlay-audio .text{font-size:4rem;color:#fff;font-weight:400;user-select:none}
  .overlay-audio.hidden{opacity:0;pointer-events:none;transition:opacity .3s}

  /* ===== TOP-LEFT REVEAL BUTTONS ===== */
  .revealAudioLike{
    display:flex;align-items:center;gap:8px;
    position:fixed;top:15px;left:15px;z-index:5;
  }
  .audio_control{
    display:flex;align-items:center;line-height:0;
    width:58px;height:58px;border-radius:10px;
    background:rgba(15,15,15,.2);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.06);
    padding:15px;transition:.3s;gap:20px;overflow:hidden;
    cursor:pointer;
  }
  .audio_control:hover{width:180px;padding-right:25px}
  .audio_control .volumeIcon{font-size:2.8rem;color:#fff;flex-shrink:0}
  .audio_control.muted .volumeIcon{color:#666}
  .slider-container{position:relative;width:100%}
  .vol-slider{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;
    background:rgba(255,255,255,.15);border-radius:6px;outline:none;cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}

  .like_button{
    display:flex;align-items:center;justify-content:center;line-height:0;
    width:58px;height:58px;border-radius:10px;
    background:rgba(15,15,15,.2);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.06);
    padding:15px;transition:.3s;cursor:pointer;
  }
  .like_button .likeIcon{font-size:2.8rem;color:#fff}
  .like_button.liked .likeIcon{color:#c50b2b}

  /* ===== BIO CONTAINER ===== */
  .bio-container{
    width:100%;max-width:1000px;margin:auto;
    position:relative;z-index:1;
  }
  @media(max-width:768px){.bio-container{width:95vw}}

  /* ===== CSS CONTENT CARD ===== */
  .css_content_container{
    backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
    background:rgba(255,255,255,0);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.06);
    padding:20px;
    width:100%;
  }

  /* ===== BOTTOM-LEFT INFO ===== */
  .info_container{
    display:flex;align-items:center;gap:8px;
    position:fixed;bottom:15px;left:20px;z-index:50;
  }
  .bio_infomation{
    display:flex;align-items:center;gap:5px;
    cursor:pointer;
  }
  .bio_infomation svg{font-size:2rem;color:#fff}
  .bio_infomation .text{font-size:1.4rem;color:#fff}

  /* ===== SCREEN 1 (hero) ===== */
  .screen_1{position:relative}
  .screen_1 .main_content{
    display:flex;min-height:100svh;
    align-items:center;justify-content:center;
    flex-direction:column;
  }
  .img_container{
    position:relative;width:160px;height:160px;flex-shrink:0;
  }
  .img_container .img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;
    position:relative;z-index:2;
  }
  .img_effect{
    position:absolute;width:118%;top:50%;left:50%;
    transform:translate(-50%,-50%);z-index:1;
    animation:glowSpin 5s linear infinite;
    aspect-ratio:1;
  }
  @keyframes glowSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .screen_1 .header{
    font-size:3.6rem;font-weight:600;color:#fff;
    text-shadow:0 0 16.5px #fff;
    margin-top:15px;line-height:1.3em;
  }

  /* ===== BADGES ===== */
  .badge_container{
    display:flex;align-items:center;gap:8px;margin-top:12px;
    background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.1);
    padding:6px 14px;border-radius:15px;
  }
  .badge_container svg{font-size:2rem;color:#fff;filter:drop-shadow(0 0 6px #fff)}

  /* ===== SVG SOCIAL ===== */
  .svg_container{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    width:100%;margin-top:18px;gap:4px;
  }
  .svg_item{
    display:flex;align-items:center;font-size:3.6rem;padding:6px 8px;
    cursor:pointer;background:none;border:none;border-radius:5px;
    transition:transform .25s;line-height:0;
    filter:drop-shadow(0 0 7px #fff);
    text-decoration:none;color:#fff;
  }
  .svg_item:hover{transform:scale(1.1)}
  .svg_item svg{width:36px;height:36px}

  /* ===== SUGGEST (scroll hint) ===== */
  .suggest{
    display:flex;align-items:center;flex-direction:column;
    position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    color:#fff;opacity:.4;
    animation:bounceSuggest 1s linear infinite;
  }
  .suggest .text{font-size:1.4rem}
  .suggest i{font-size:1.3rem}
  @keyframes bounceSuggest{
    0%,to{animation-timing-function:cubic-bezier(.8,0,1,1);transform:translateY(-25%) translateX(-50%)}
    50%{animation-timing-function:cubic-bezier(0,0,.2,1);transform:translateX(-50%)}
  }

  /* ===== SCREEN 2 (about) ===== */
  .screen_2{position:relative}
  .screen_2 .main_content{
    display:flex;min-height:100svh;
    align-items:flex-start;justify-content:center;
    flex-direction:column;gap:15px;
    max-width:98vw;margin:0 auto;padding:48px 0;
  }
  .screen_2 .header{
    font-size:2.2rem;color:#fff;
    text-shadow:0 0 16.5px #fff;
  }
  .description_container{
    padding:15px;
  }
  .description_container .description{
    font-size:1.8rem;line-height:1.4em;color:#fff;
    text-shadow:0 0 16.5px #fff;
  }

  /* ===== AUDIO CONTAINER ===== */
  .audio_container{
    display:flex;align-items:center;gap:10px;padding:15px;
  }
  .audio_image{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#1c1c2a;flex-shrink:0}
  .audio_content_container{display:flex;flex-direction:column;flex:1;overflow:hidden}
  .audio_content_container .name{
    font-size:2.2rem;color:#fff;font-weight:500;margin-bottom:3px;line-height:1em;
  }
  .flex{display:flex;align-items:center;gap:4px;width:100%}
  .flex .duration{font-size:1.4rem;color:#fff;width:32px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}
  .flex .slideTrack{flex:1;margin:0 4px;cursor:pointer}
  .slideTrack input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;
    background:rgba(255,255,255,.15);border-radius:6px;outline:none;cursor:pointer;
  }
  .slideTrack input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;border:none}
  .flex button{
    background:none;border:none;cursor:pointer;line-height:0;
    color:#fff;flex-shrink:0;
  }
  .flex button svg{font-size:1.8rem}
  .flex button#playPause svg{font-size:3.6rem}
  .flex button:hover{opacity:.8}

  .hidden-input{display:none}

  /* ===== SPARKLE CURSOR CANVAS ===== */
  #particleCanvas{
    position:fixed;inset:0;z-index:2;pointer-events:none;
  }

  @media(max-width:520px){
    .screen_1 .header{font-size:2.8rem}
    .img_container{width:120px;height:120px}
    .svg_item{font-size:2.8rem;padding:4px}
    .svg_item svg{width:28px;height:28px}
    .audio_image{width:60px;height:60px}
    .revealAudioLike{top:10px;left:10px}
    .audio_control,.like_button{width:44px;height:44px;padding:10px;font-size:2.2rem}
    .audio_control:hover{width:140px}
  }
</style>
</head>

              </button>
              <button id="playPause" title="Phát">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M10 16.5v-9l6 4.5M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2"/></svg>
              </button>
              <button id="forward" title="Tua tới">
                <svg style="transform:rotate(180deg)" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 51.532 51.532" fill="currentColor"><path d="M6.631 1.963a6.63 6.63 0 0 1 6.631 6.631V23.81a4 4 0 0 1 1-.831l31.27-18.053a3.998 3.998 0 0 1 6 3.464v36.105a4 4 0 0 1-6 3.463l-31.27-18.053a4 4 0 0 1-1-.83v13.863a6.631 6.631 0 0 1-13.262 0V8.594a6.63 6.63 0 0 1 6.631-6.631"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<input type="file" accept="audio/*" class="hidden-input" id="audioFileInput">

<script>
(function(){
  // ===== STARFIELD =====
  function gen(n,w,h){const a=[];for(let i=0;i<n;i++)a.push(`${~~(Math.random()*w)}px ${~~(Math.random()*h)}px #fff`);return a.join(',')}
  const W=2000,H=2000;
  document.querySelector('.stars-1').style.setProperty('--s1',gen(350,W,H));
  document.querySelector('.stars-2').style.setProperty('--s2',gen(150,W,H));
  document.querySelector('.stars-3').style.setProperty('--s3',gen(70,W,H));

  // ===== SPARKLE CURSOR (giống zyo.lol) =====
  (function(){
    const canvas=document.getElementById('particleCanvas');
    const ctx=canvas.getContext('2d');
    let w,h;
    const particles=[];
    const MAX=200;
    const mouse={x:null,y:null};

    function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
    resize();window.addEventListener('resize',resize);

    class Spark{
      constructor(x,y){
        this.x=x;this.y=y;
        this.size=1+Math.random()*2;
        this.life=1;
        this.decay=0.008+Math.random()*0.02;
        this.vx=(Math.random()-0.5)*1.2;
        this.vy=(Math.random()-0.5)*1.2-1;
      }
      update(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;this.vy+=0.02}
      draw(){
        if(this.life<=0)return false;
        ctx.globalAlpha=this.life;
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        return true;
      }
    }

    function animate(){
      ctx.clearRect(0,0,w,h);
      if(mouse.x!=null&&Math.random()<0.7){
        particles.push(new Spark(mouse.x,mouse.y));
        if(particles.length>MAX)particles.splice(0,particles.length-MAX);
      }
      for(let i=particles.length-1;i>=0;i--){
        if(!particles[i].draw())particles.splice(i,1);
        else particles[i].update();
      }
      requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
    document.addEventListener('mouseleave',()=>{mouse.x=null;mouse.y=null});
    document.addEventListener('touchmove',e=>{mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY},{passive:true});
    document.addEventListener('touchend',()=>{mouse.x=null;mouse.y=null});
  })();

  // ===== OVERLAY =====
  const overlay=document.getElementById('overlayAudio');
  const audio=new Audio();
  audio.crossOrigin='anonymous';
  audio.src='music.mp3';
  audio.volume=1;
  let playing=false,loaded=false,seeking=false,started=false;

  function fmt(s){if(isNaN(s)||s===Infinity)return'0:00';const m=~~(s/60);return m+':'+String(~~(s%60)).padStart(2,'0')}
  function updateVolIcon(muted){
    document.getElementById('audioControl').classList.toggle('muted',muted);
  }
  function updatePlayBtn(){document.getElementById('playPause').innerHTML=playing
    ?'<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M15 16h-2V8h2m-4 8H9V8h2m1-6A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2"/></svg>'
    :'<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M10 16.5v-9l6 4.5M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2"/></svg>';}

  window.hideOverlay=function(){
    overlay.style.opacity='0';
    setTimeout(()=>{overlay.style.display='none'},300);
    if(!started){audio.play().catch(()=>{});playing=true;started=true;updatePlayBtn()}
  };

  audio.addEventListener('loadedmetadata',()=>{loaded=true;document.getElementById('totalTime').textContent=fmt(audio.duration);document.getElementById('audioSlider').max=audio.duration||100});
  audio.addEventListener('loadeddata',()=>{if(!loaded){loaded=true;document.getElementById('totalTime').textContent=fmt(audio.duration||0);document.getElementById('audioSlider').max=audio.duration||100}});
  audio.addEventListener('timeupdate',()=>{if(!seeking&&audio.duration){document.getElementById('audioSlider').value=audio.currentTime;document.getElementById('currentTime').textContent=fmt(audio.currentTime)}});
  audio.addEventListener('ended',()=>{playing=false;updatePlayBtn()});

  // ===== VOLUME =====
  const volSlider=document.getElementById('volSlider');
  volSlider.addEventListener('input',()=>{audio.volume=volSlider.value/100;updateVolIcon(volSlider.value==0)});
  window.toggleMute=function(){
    if(audio.volume>0){audio.volume=0;volSlider.value=0;updateVolIcon(true)}
    else{audio.volume=1;volSlider.value=100;updateVolIcon(false)}
  };

  // ===== PLAY/PAUSE =====
  document.getElementById('playPause').addEventListener('click',()=>{
    if(!loaded)return;
    if(playing){audio.pause()}else{audio.play().catch(()=>{})}
    playing=!playing;updatePlayBtn();
  });

  // ===== SEEK =====
  const seekSlider=document.getElementById('audioSlider');
  seekSlider.addEventListener('input',()=>{seeking=true;document.getElementById('currentTime').textContent=fmt(parseFloat(seekSlider.value))});
  seekSlider.addEventListener('change',()=>{audio.currentTime=parseFloat(seekSlider.value);seeking=false});

  document.getElementById('backward').addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-5)});
  document.getElementById('forward').addEventListener('click',()=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5)});

  // Keyboard controls
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();document.getElementById('playPause').click()}
    if(e.code==='ArrowLeft'){audio.currentTime-=5}
    if(e.code==='ArrowRight'){audio.currentTime+=5}
  });

  // ===== UPLOAD AUDIO =====
  document.getElementById('audioFileInput').addEventListener('change',function(e){
    const f=e.target.files[0];if(!f)return;
    const was=playing;audio.pause();audio.src=URL.createObjectURL(f);
    playing=false;loaded=false;seekSlider.value=0;
    document.getElementById('currentTime').textContent='0:00';document.getElementById('totalTime').textContent='0:00';
    document.getElementById('musicName').textContent=f.name.replace(/\.[^.]+$/,'');
    updatePlayBtn();audio.load();
    if(was){audio.addEventListener('loadeddata',()=>{audio.play().catch(()=>{});playing=true;updatePlayBtn()},{once:true})}
  });

  // ===== TYPEWRITER CYCLING NAME =====
  (function(){
    const nameEl=document.getElementById('userName');
    const names=['hoainam','xie'];
    let nameIdx=0,charIdx=0,deleting=false;
    function tick(){
      const current=names[nameIdx];
      if(!deleting){
        nameEl.textContent=current.substring(0,charIdx+1);
        charIdx++;
        if(charIdx===current.length){deleting=true;setTimeout(tick,1500);return}
        setTimeout(tick,120+Math.random()*80);
      }else{
        nameEl.textContent=current.substring(0,charIdx-1);
        charIdx--;
        if(charIdx===0){deleting=false;nameIdx=(nameIdx+1)%names.length;setTimeout(tick,300);return}
        setTimeout(tick,50+Math.random()*30);
      }
    }
    tick();
  })();

  // ===== LIKE =====
  const ST='hoainam_v6_';
  let liked=localStorage.getItem(ST+'liked')==='true';
  let likeCount=parseInt(localStorage.getItem(ST+'likeCount')||'1000000')||1000000;

  function fmtNum(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
  function updateAllLikes(){
    document.getElementById('likeCountText').textContent=fmtNum(likeCount);
    document.getElementById('likeBtn').classList.toggle('liked',liked);
  }
  updateAllLikes();

  window.toggleLike=function(){
    liked=!liked;likeCount+=liked?1:-1;if(likeCount<0)likeCount=0;
    localStorage.setItem(ST+'liked',liked);localStorage.setItem(ST+'likeCount',likeCount);
    updateAllLikes();
  };

  // ===== VIEWS =====
  let viewCount=parseInt(localStorage.getItem(ST+'viewCount')||'1000000')||1000000;
  if(!sessionStorage.getItem(ST+'session')){viewCount++;localStorage.setItem(ST+'viewCount',viewCount);sessionStorage.setItem(ST+'session','1')}
  document.getElementById('viewCountText').textContent=fmtNum(viewCount);

  console.log('%c✨ Hoài Nam %cReady','color:#ff00c1;font-size:16px','color:#00fff9');
})();
</script>
</body>
</html>
